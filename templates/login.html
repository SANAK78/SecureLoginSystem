<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Access | Cyber Shield Console</title>

    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-base: #040711;
            --card-surface: rgba(13, 22, 41, 0.72);
            --border-subtle: rgba(56, 189, 248, 0.16);
            --border-glow: rgba(56, 189, 248, 0.45);
            --accent-cyan: #38bdf8;
            --accent-blue: #3b82f6;
            --accent-indigo: #6366f1;
            --accent-green: #10b981;
            --text-heading: #f8fafc;
            --text-secondary: #94a3b8;
            --glow-cyan: rgba(56, 189, 248, 0.35);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            min-height: 100vh;
            background-color: var(--bg-base);
            color: var(--text-heading);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
            overflow: hidden;
            position: relative;
        }

        /* ====== ANIMATED CYBER & AMBIENT MESH BACKGROUND ====== */
        .ambient-mesh {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.5;
            animation: orbFloat 14s infinite alternate ease-in-out;
        }

        .orb-1 {
            width: 480px;
            height: 480px;
            background: radial-gradient(circle, #38bdf8, transparent 65%);
            top: -15%;
            left: 15%;
        }

        .orb-2 {
            width: 520px;
            height: 520px;
            background: radial-gradient(circle, #6366f1, transparent 70%);
            bottom: -20%;
            right: 10%;
            animation-duration: 18s;
            animation-delay: -5s;
        }

        @keyframes orbFloat {
            0% { transform: translate(0px, 0px) scale(1); }
            50% { transform: translate(50px, 35px) scale(1.08); }
            100% { transform: translate(-40px, -50px) scale(0.95); }
        }

        /* 3D Perspective Floor Grid */
        .cyber-grid {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(14, 165, 233, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(14, 165, 233, 0.08) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: perspective(600px) rotateX(45deg) translateY(-80px) scale(1.8);
            animation: gridDrive 16s linear infinite;
            z-index: 1;
            pointer-events: none;
            opacity: 0.85;
        }

        @keyframes gridDrive {
            from { background-position: 0 0; }
            to { background-position: 0 100px; }
        }

        /* Floating Cyber Dust */
        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 2;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: var(--accent-cyan);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-cyan);
            animation: particleDrift 8s ease-in-out infinite alternate;
        }

        .particle:nth-child(1) { left: 15%; top: 25%; }
        .particle:nth-child(2) { left: 82%; top: 30%; animation-delay: 1.5s; }
        .particle:nth-child(3) { left: 25%; top: 75%; animation-delay: 3s; }
        .particle:nth-child(4) { left: 70%; top: 70%; animation-delay: 4.5s; }
        .particle:nth-child(5) { left: 50%; top: 12%; animation-delay: 2s; }

        @keyframes particleDrift {
            from { transform: translateY(0); opacity: 0.2; }
            to { transform: translateY(-40px); opacity: 0.9; }
        }

        /* ====== PREMIUM LOGIN CARD ====== */
        .login-box {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            padding: 42px 38px 36px;
            background: var(--card-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 26px;
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            box-shadow: 0 35px 80px -20px rgba(0, 0, 0, 0.85),
                        0 0 0 1px rgba(255, 255, 255, 0.05),
                        0 0 35px rgba(14, 165, 233, 0.12);
            animation: cardEntrance 0.7s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(25px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Laser Scanning Ray on top */
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), #818cf8, transparent);
            box-shadow: 0 0 18px var(--accent-cyan);
            animation: scanPass 5s ease-in-out infinite;
        }

        @keyframes scanPass {
            0%, 100% { top: 0; opacity: 0.3; }
            50% { top: 100%; opacity: 0.9; }
        }

        /* Shield Brand Badge */
        .brand-badge {
            width: 76px;
            height: 76px;
            margin: 0 auto 20px;
            border-radius: 22px;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.14), rgba(99, 102, 241, 0.08));
            border: 1px solid var(--border-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-cyan);
            box-shadow: 0 10px 30px -5px var(--glow-cyan);
            position: relative;
            transition: all 0.3s ease;
        }

        .brand-badge:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 35px var(--glow-cyan);
        }

        .brand-badge svg {
            width: 38px;
            height: 38px;
            filter: drop-shadow(0 0 8px var(--accent-cyan));
        }

        /* Headings */
        .title-block {
            text-align: center;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 1.65rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--text-heading);
            margin-bottom: 6px;
        }

        .gradient-span {
            background: linear-gradient(135deg, var(--accent-cyan), #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-secondary);
            font-size: 0.76rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        /* Node Security Status Pill */
        .node-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 6px 14px;
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.22);
            border-radius: 100px;
            width: fit-content;
            margin: 0 auto 26px;
            font-size: 0.74rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: var(--accent-green);
        }

        .pulse-dot {
            width: 7px;
            height: 7px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 0 rgba(16, 185, 129, 0.7);
            animation: pulseGlow 1.8s infinite;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 7px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* Form Inputs */
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #bae6fd;
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 0.05em;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            pointer-events: none;
            transition: color 0.2s ease;
        }

        input {
            width: 100%;
            padding: 14px 16px 14px 44px;
            background: rgba(8, 14, 28, 0.7);
            border: 1px solid rgba(56, 189, 248, 0.18);
            border-radius: 13px;
            color: #fff;
            font-size: 0.92rem;
            font-weight: 500;
            outline: none;
            transition: all 0.25s ease;
        }

        input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15),
                        0 0 20px rgba(56, 189, 248, 0.2);
            background: rgba(10, 18, 36, 0.85);
        }

        input:focus + .input-icon,
        .input-wrapper:focus-within .input-icon {
            color: var(--accent-cyan);
        }

        input::placeholder {
            color: #475569;
            font-size: 0.85rem;
        }

        /* Password Toggle */
        .pass-toggle {
            position: absolute;
            right: 14px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 4px;
            transition: color 0.2s;
        }

        .pass-toggle:hover {
            color: var(--accent-cyan);
        }

        /* Action Button */
        button[type="submit"] {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--accent-blue) 50%, var(--accent-indigo) 100%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            color: #fff;
            font-size: 0.92rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            cursor: pointer;
            box-shadow: 0 8px 24px -4px var(--glow-cyan);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(56, 189, 248, 0.5);
            filter: brightness(1.05);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }

        /* Register & Footer Links */
        .register-link {
            text-align: center;
            margin-top: 22px;
            font-size: 0.84rem;
            color: var(--text-secondary);
        }

        .register-link a {
            color: var(--accent-cyan);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s;
        }

        .register-link a:hover {
            color: #bae6fd;
            text-shadow: 0 0 12px var(--accent-cyan);
        }

        /* Terminal Security Badge */
        .sec-footer {
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: #64748b;
            letter-spacing: 0.04em;
        }

        @media (max-width: 480px) {
            .login-box {
                padding: 34px 22px 28px;
            }
            h1 { font-size: 1.45rem; }
        }
    </style>
</head>

<body>

    <!-- Ambient Glow Mesh (Dashboard matching) -->
    <div class="ambient-mesh">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <!-- 3D Perspective Moving Grid -->
    <div class="cyber-grid"></div>

    <!-- Floating Cyber Micro-particles -->
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <!-- Glassmorphic Login Box -->
    <div class="login-box">

        <!-- Laser Scanner -->
        <div class="scan-line"></div>

        <!-- Cyber Shield Brand Icon -->
        <div class="brand-badge">
            <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                <path d="M9 12l2 2 4-4" stroke-width="2.5"/>
            </svg>
        </div>

        <div class="title-block">
            <h1>Secure <span class="gradient-span">Access</span></h1>
            <p class="subtitle">CYBER SHIELD ENTERPRISE NODE</p>
        </div>

        <div class="node-status">
            <span class="pulse-dot"></span>
            DEFENSE PROTOCOL ACTIVE
        </div>

        <!-- Login Form -->
        <form method="POST">

            <!-- Username Field -->
            <div class="form-group">
                <label for="username">OPERATOR IDENTITY</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </span>
                    <input type="text" id="username" name="username" placeholder="Enter username or email" required autocomplete="username">
                </div>
            </div>

            <!-- Password Field -->
            <div class="form-group">
                <label for="password">SECURITY KEY</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </span>
                    <input type="password" id="password" name="password" placeholder="Enter security passphrase" required autocomplete="current-password">
                    
                    <!-- Password Show/Hide Toggle -->
                    <button type="button" class="pass-toggle" id="togglePass" aria-label="Toggle password visibility">
                        <svg id="eyeIcon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit">
                <span>AUTHORIZE ACCESS</span>
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>

        </form>

        <!-- Register Link -->
        <div class="register-link">
            Unauthorized node? <a href="/register">Register Identity</a>
        </div>

        <!-- Terminal Security Footer -->
        <div class="sec-footer">
            <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <span>TLS 1.3 • 256-BIT ENCRYPTION</span>
        </div>

    </div>

    <!-- Password Visibility Toggle Script -->
    <script>
        const toggleBtn = document.getElementById('togglePass');
        const passInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');

        toggleBtn.addEventListener('click', () => {
            const isPassword = passInput.getAttribute('type') === 'password';
            passInput.setAttribute('type', isPassword ? 'text' : 'password');
            
            // Toggle Eye / Eye-off icon
            if (isPassword) {
                eyeIcon.innerHTML = `
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                `;
            } else {
                eyeIcon.innerHTML = `
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                `;
            }
        });
    </script>

</body>
</html>
